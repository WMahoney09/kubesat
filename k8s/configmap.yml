apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesat-config
  namespace: kubesat-dev
  labels:
    app.kubernetes.io/part-of: kubesat
data:
  TARGET_REPO: ""
  ORBIT_INTERVAL: "300"
  BRANCH_CONVENTION: "kubesat/<orbit-timestamp>/<short-slug>"
  # Optional override for the image the Dispatcher launches Actor Jobs with.
  # Defaults to the Dispatcher's own image, so Actors match its build
  # automatically — set this only to run Actors on a different image.
  # ACTOR_IMAGE: "kubesat:latest"
  # Optional: set to enable adapter-mode delta detection (e.g., github-issues)
  # KUBESAT_ADAPTER: ""
  # ADAPTER_REPO: ""
