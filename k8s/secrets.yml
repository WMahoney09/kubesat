# Template — do not commit real values.
# Apply real secrets via: kubectl create secret generic kubesat-secrets \
#   --namespace=kubesat-dev \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#   --from-literal=GITHUB_TOKEN=ghp_...
#
# Fuel: provide ANTHROPIC_API_KEY (API billing) OR CLAUDE_CODE_OAUTH_TOKEN
# (subscription billing, generated via `claude setup-token`).
#
# Additional secrets may be required depending on the adapter.
# See adapters/README.md for per-adapter documentation.
apiVersion: v1
kind: Secret
metadata:
  name: kubesat-secrets
  namespace: kubesat-dev
  labels:
    app.kubernetes.io/part-of: kubesat
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "PLACEHOLDER"
  GITHUB_TOKEN: "PLACEHOLDER"
