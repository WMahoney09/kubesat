apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesat-dispatcher
  namespace: kubesat-dev
  labels:
    app.kubernetes.io/part-of: kubesat
    app.kubernetes.io/component: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kubesat
        app.kubernetes.io/component: dispatcher
    spec:
      serviceAccountName: kubesat-dispatcher
      containers:
        - name: dispatcher
          image: kubesat:latest
          imagePullPolicy: IfNotPresent
          command: ["./entrypoint-dispatcher.sh"]
          envFrom:
            - secretRef:
                name: kubesat-secrets
            - configMapRef:
                name: kubesat-config
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: orbit-state
              mountPath: /home/agent/orbit-state
            - name: mission
              mountPath: /home/agent/mission.md
              subPath: mission.md
              readOnly: true
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
      volumes:
        - name: orbit-state
          persistentVolumeClaim:
            claimName: orbit-state
        - name: mission
          configMap:
            name: kubesat-mission
